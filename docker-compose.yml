services:
  brief:
    image: ghcr.io/mxw02/brief:${BRIEF_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brief
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      BRIEF_DATA_DIR: /app/data
      BRIEF_UPLOADS_DIR: /app/uploads
      BRIEF_API_TOKEN: ${BRIEF_API_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-brief}:${POSTGRES_PASSWORD:-brief}@postgres:5432/${POSTGRES_DB:-brief}}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - brief_data:/app/data
      - brief_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: brief-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brief}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brief}
      POSTGRES_DB: ${POSTGRES_DB:-brief}
    volumes:
      - brief_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brief} -d ${POSTGRES_DB:-brief}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  brief_data:
  brief_uploads:
  brief_pgdata:
